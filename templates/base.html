<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ title }}</title>
</head>
<body>
<header>
    <nav class="navbar navbar-expand navbar-light bg-light top-nav">
        <a class="navbar-brand" href="/">Кружки школы</a>
        <div class="nav-actions">
            {% if current_user.is_authenticated %}
                <a class="btn btn-outline-primary" href="/profile">{{ current_user.name }}</a>
                <a class="btn btn-outline-secondary" href="/logout">Выйти</a>
            {% else %}
                <a class="btn btn-primary" href="/register">Зарегистрироваться</a>
                <a class="btn btn-success" href="/login">Войти</a>
            {% endif %}
        </div>
    </nav>
</header>
<main role="main" class="container">
    {% block content %}{% endblock %}
</main>
</body>
</html>
